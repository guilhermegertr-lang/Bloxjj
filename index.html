<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocks GG</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center}
header{background:#d7192d;padding:20px}
button{background:#e21d32;color:white;border:0;padding:12px;margin:5px;border-radius:8px}
input,select{padding:10px;margin:5px}
.card{background:#292929;padding:15px;margin:10px;border-radius:10px}
#admin{display:none}
</style>
</head>
<body>
<header><h1>BLOCKS GG</h1></header>

<h2>Minha loja</h2>
<div id="products"></div>

<h2>Área do Dono</h2>
<button onclick="login()">Entrar como dono</button>

<div id="admin">
<h3>Adicionar produto</h3>
<input id="name" placeholder="Nome do produto">
<select id="category">
<option>Blox Fruits</option>
<option>Roube um Ovo</option>
</select>
<input id="price" type="number" placeholder="Preço até 20 reais">
<button onclick="add()">Adicionar produto</button>
</div>

<script>
const senha="blocksGG-demo";
let produtos=[
{nome:"Produto exemplo",categoria:"Blox Fruits",preco:20}
];

function mostrar(){
document.getElementById("products").innerHTML="";
produtos.forEach(p=>{
document.getElementById("products").innerHTML+=
"<div class='card'><h3>"+p.nome+"</h3><p>"+p.categoria+"</p><b>R$ "+p.preco+"</b></div>";
});
}

function login(){
if(prompt("Senha do dono:")===senha){
document.getElementById("admin").style.display="block";
}else alert("Senha incorreta");
}

function add(){
let nome=document.getElementById("name").value;
let categoria=document.getElementById("category").value;
let preco=Number(document.getElementById("price").value);
if(!nome||preco<0||preco>20){alert("Preço máximo R$ 20");return}
produtos.push({nome,categoria,preco});
mostrar();
alert("Produto adicionado neste navegador");
}
mostrar();
</script>
</body>
</html>
