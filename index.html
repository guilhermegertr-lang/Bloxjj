
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOKO JJ</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101018;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{
 background:linear-gradient(135deg,#d71936,#760019);
 padding:28px 15px;
}
header h1{font-size:34px;margin:0}
header p{margin-bottom:0}
button{
 border:0;
 border-radius:9px;
 padding:13px 18px;
 background:#e51b3e;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:6px;
}
button:active{transform:scale(.97)}
.container{padding:18px}
.card{
 background:#20202c;
 border:1px solid #383849;
 border-radius:14px;
 padding:16px;
 margin:14px auto;
 max-width:420px;
}
.card h3{color:#ff4964}
input,textarea{
 width:100%;
 padding:12px;
 border-radius:8px;
 border:1px solid #555;
 margin:7px 0;
 background:#171721;
 color:white;
}
img{
 max-width:100%;
 border-radius:10px;
}
#admin{display:none}
#products{
 display:grid;
 grid-template-columns:1fr;
 gap:12px;
}
footer{padding:25px;color:#aaa}
</style>
</head>

<body>

<header>
<h1>🔥 BLOKO JJ 🔥</h1>
<p>As melhores contas estão aqui!</p>
</header>

<div class="container">

<h2>🛒 Nossa Loja</h2>

<div id="products">
<div class="card">
<h3>Conta de Roblox</h3>
<p>Consulte os produtos disponíveis.</p>
<button onclick="addCart('Conta de Roblox')">
Adicionar ao carrinho
</button>
</div>
</div>

<h2>🛒 Meu Carrinho</h2>
<div class="card">
<div id="cart">Carrinho vazio</div>
<button onclick="finishOrder()">Finalizar pedido</button>
</div>

<hr>

<button onclick="login()">👑 ÁREA DO DONO</button>

<section id="admin">
<div class="card">
<h2>👑 PAINEL DO DONO</h2>
<h3>Adicionar produto</h3>

<input id="name" placeholder="Nome do produto">
<input id="price" placeholder="Preço">
<input id="photo" placeholder="Link da imagem">
<textarea id="description" placeholder="Descrição"></textarea>

<button onclick="addProduct()">Adicionar produto</button>

<h3>Produtos cadastrados</h3>
<div id="adminProducts"></div>

<button onclick="logout()">Sair do painel</button>
</div>
</section>

</div>

<footer>
BLOKO JJ © 2026
</footer>

<script>
let cart = [];

function login(){
 const senha = prompt("Digite a senha do dono:");

 if(senha === "jj2026"){
  document.getElementById("admin").style.display="block";
  document.getElementById("admin").scrollIntoView();
  showAdminProducts();
  alert("Bem-vindo ao painel do dono!");
 }else if(senha !== null){
  alert("Senha incorreta!");
 }
}

function logout(){
 document.getElementById("admin").style.display="none";
}

function addCart(product){
 cart.push(product);
 updateCart();
 alert("Produto adicionado!");
}

function updateCart(){
 document.getElementById("cart").innerHTML =
 cart.length ? cart.map(p=>"<p>"+p+"</p>").join("") : "Carrinho vazio";
}

function finishOrder(){
 if(!cart.length){
  alert("Seu carrinho está vazio!");
  return;
 }
 alert("Pedido: "+cart.join(", "));
}

function addProduct(){
 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();
 const photo=document.getElementById("photo").value.trim();
 const description=document.getElementById("description").value.trim();

 if(!name || !price){
  alert("Preencha nome e preço!");
  return;
 }

 const products=JSON.parse(localStorage.getItem("blokoProducts")||"[]");

 products.push({name,price,photo,description});

 localStorage.setItem("blokoProducts",JSON.stringify(products));

 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("photo").value="";
 document.getElementById("description").value="";

 showProducts();
 showAdminProducts();
 alert("Produto adicionado!");
}

function showProducts(){
 const products=JSON.parse(localStorage.getItem("blokoProducts")||"[]");
 const area=document.getElementById("products");

 area.innerHTML=`
 <div class="card">
 <h3>Conta de Roblox</h3>
 <p>Consulte os produtos disponíveis.</p>
 <button onclick="addCart('Conta de Roblox')">Adicionar ao carrinho</button>
 </div>`;

 products.forEach((p,i)=>{
  area.innerHTML+=`
  <div class="card">
  ${p.photo?'<img src="'+p.photo+'">':''}
  <h3>${escapeHTML(p.name)}</h3>
  <p>${escapeHTML(p.description)}</p>
  <p>R$ ${escapeHTML(p.price)}</p>
  <button onclick="addCart('${escapeJS(p.name)}')">Comprar</button>
  </div>`;
 });
}

function showAdminProducts(){
 const products=JSON.parse(localStorage.getItem("blokoProducts")||"[]");
 document.getElementById("adminProducts").innerHTML=
 products.map((p,i)=>`
 <div class="card">
 <p>${escapeHTML(p.name)} - R$ ${escapeHTML(p.price)}</p>
 <button onclick="deleteProduct(${i})">Excluir</button>
 </div>`).join("") || "Nenhum produto cadastrado.";
}

function deleteProduct(i){
 const products=JSON.parse(localStorage.getItem("blokoProducts")||"[]");
 products.splice(i,1);
 localStorage.setItem("blokoProducts",JSON.stringify(products));
 showProducts();
 showAdminProducts();
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function escapeJS(s){
 return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

showProducts();
</script>

</body>
</html>
