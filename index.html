
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOKO JJ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial;text-align:center}
header{background:linear-gradient(135deg,#d71936,#760019);padding:28px 15px}
header h1{font-size:34px;margin:0}
.container{padding:15px}
button{border:0;border-radius:9px;padding:13px 18px;background:#e51b3e;color:white;font-weight:bold;cursor:pointer;margin:6px}
.card{background:#20202c;border:1px solid #383849;border-radius:14px;padding:16px;margin:14px auto;max-width:440px}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;margin:7px 0;background:#171721;color:white}
img{max-width:100%;border-radius:10px}
#admin,#loginArea{display:none}
footer{padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🔥 BLOKO JJ 🔥</h1>
<p>As melhores contas estão aqui!</p>
</header>
<div class="container">
<h2>🛍️ NOSSA LOJA</h2>
<div id="products"></div>
<h2>🛒 MEU CARRINHO</h2>
<div class="card">
<div id="cart">Carrinho vazio</div>
<h3 id="total">Total: R$ 0,00</h3>
<button onclick="finishOrder()">FINALIZAR PEDIDO</button>
</div>
<hr>
<button onclick="openLogin()">👑 ÁREA DO DONO</button>
<section id="loginArea">
<div class="card">
<h2>🔐 ACESSO DO DONO</h2>
<input type="password" id="ownerPassword" placeholder="Digite sua senha">
<button onclick="login()">ENTRAR</button>
<button onclick="closeLogin()">VOLTAR</button>
<p id="loginMessage"></p>
</div>
</section>
<section id="admin">
<div class="card">
<h2>👑 PAINEL DO DONO</h2>
<input id="name" placeholder="Nome do produto">
<input id="price" placeholder="Preço">
<label for="photo">📁 ESCOLHER PRINT DA GALERIA</label>
<input id="photo" type="file" accept="image/*">
<div id="preview"></div>
<textarea id="description" placeholder="Descrição"></textarea>
<button onclick="addProduct()">ADICIONAR PRODUTO</button>
<h3>Produtos cadastrados</h3>
<div id="adminProducts"></div>
<button onclick="logout()">SAIR DO PAINEL</button>
</div>
</section>
</div>
<footer>BLOKO JJ © 2026</footer>
<script>
let cart=[];

function getProducts(){
try{return JSON.parse(localStorage.getItem("blokoProducts")||"[]")}
catch(e){return []}
}
function saveProducts(p){
localStorage.setItem("blokoProducts",JSON.stringify(p));
}
function openLogin(){
document.getElementById("loginArea").style.display="block";
}
function closeLogin(){
document.getElementById("loginArea").style.display="none";
}
function login(){
if(document.getElementById("ownerPassword").value==="jj2026"){
document.getElementById("loginArea").style.display="none";
document.getElementById("admin").style.display="block";
showAdminProducts();
}else{
document.getElementById("loginMessage").textContent="Senha incorreta!";
}
}
function logout(){
document.getElementById("admin").style.display="none";
}
document.getElementById("photo").addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
if(file.size>2*1024*1024){
alert("Escolha uma imagem de até 2 MB");
this.value="";
return;
}
const reader=new FileReader();
reader.onload=()=>{
document.getElementById("preview").innerHTML="";
const img=document.createElement("img");
img.src=reader.result;
img.style.maxWidth="220px";
document.getElementById("preview").appendChild(img);
};
reader.readAsDataURL(file);
});
</script>
</body>
</html>
