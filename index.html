<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOQUE JJ</title><style>
*{box-sizing:border-box}
body{
  background:#09090f;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  text-align:center;
}
header{
  background:linear-gradient(135deg,#ff1744,#700020,#150015);
  padding:35px 15px;
}
h1{font-size:38px;margin:10px}
header p{color:#ffdbe3}
a{color:#ff718e}
button{
  background:linear-gradient(135deg,#ff1744,#a00025);
  color:white;
  border:0;
  padding:13px 20px;
  margin:6px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
input,select,textarea{
  padding:13px;
  margin:7px;
  width:90%;
  max-width:400px;
  border-radius:10px;
  border:1px solid #444;
  background:#171720;
  color:white;
}
.card{
  background:linear-gradient(145deg,#1c1c27,#101015);
  padding:20px;
  margin:15px auto;
  border-radius:15px;
  border:1px solid #383845;
  max-width:500px;
}
#admin{
  display:none;
  background:#171720;
  padding:20px;
  margin:15px;
  border:1px solid #ff1744;
  border-radius:15px;
}
.gallery{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}
.gallery img{
  width:30%;
  max-width:180px;
  border-radius:8px;
  object-fit:cover;
}
.price{
  color:#ff4269;
  font-size:26px;
  font-weight:bold;
}
footer{
  background:#050508;
  padding:25px;
  margin-top:30px;
}
</style></head><body><header>
<h1>🔥 BLOQUE JJ 🔥</h1>
<p>O melhor lugar para encontrar suas contas!</p>
<a href="https://www.instagram.com/gert.rudes62/"
target="_blank">@gert.rudes62</a>
</header><h2>🎮 Nossa Loja</h2>
<div id="products"></div><button onclick="login()">👑 Área do Dono</button>

<div id="admin">
<h2>👑 Painel do Dono</h2><input id="name" placeholder="Nome da conta"><select id="category">
<option>Blox Fruits</option>
<option>Roube um Ovo</option>
<option>Free Fire</option>
<option>Roblox</option>
</select><textarea id="description"
placeholder="Descrição da conta"></textarea><input id="price" type="number"
placeholder="Preço em reais (máximo R$20)">

<p>Adicionar até 3 prints:</p>
<input type="file" id="photos"
accept="image/*" multiple><button onclick="add()">Adicionar conta</button>
<button onclick="logout()">Sair</button>

</div><footer>
<h2>🔥 BLOQUE JJ 🔥</h2>
<p>Obrigado por visitar nossa loja!</p>
<a href="https://www.instagram.com/gert.rudes62/"
target="_blank">Instagram @gert.rudes62</a>
</footer><script>
const senha="Vini12";

let produtos=JSON.parse(
localStorage.getItem("bloqueJJ")||"[]"
);

function salvar(){
localStorage.setItem(
"bloqueJJ",JSON.stringify(produtos)
);
}

function escapar(texto){
return String(texto).replace(/[&<>"']/g,
c=>({"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"}[c]));
}

function mostrar(){
const area=document.getElementById("products");
area.innerHTML="";

produtos.forEach(p=>{
const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<h3>${escapar(p.nome)}</h3>
<p>${escapar(p.categoria)}</p>
<p>${escapar(p.descricao)}</p>
<div class="gallery"></div>
<p class="price">R$ ${p.preco.toFixed(2).replace(".",",")}</p>
<a href="https://www.instagram.com/gert.rudes62/"
target="_blank">COMPRAR</a>
`;

const galeria=card.querySelector(".gallery");

(p.fotos||[]).forEach(f=>{
const img=document.createElement("img");
img.src=f;
galeria.appendChild(img);
});

area.appendChild(card);
});
}

function login(){
if(prompt("Senha do dono:")===senha){
document.getElementById("admin").style.display="block";
}else{
alert("Senha incorreta");
}
}

function logout(){
document.getElementById("admin").style.display="none";
}

async function add(){
const nome=document.getElementById("name").value.trim();
const categoria=document.getElementById("category").value;
const descricao=document.getElementById("description").value.trim();
const preco=Number(document.getElementById("price").value);
const arquivos=document.getElementById("photos").files;

if(!nome||!Number.isFinite(preco)||preco<=0||preco>20){
alert("Coloque o nome e preço entre R$0,01 e R$20.");
return;
}

if(arquivos.length>3){
alert("Escolha no máximo 3 prints.");
return;
}

try{
const fotos=[];

for(const arquivo of arquivos){
if(!arquivo.type.startsWith("image/")){
alert("Escolha somente imagens.");
return;
}

fotos.push(await redimensionar(arquivo));
}

produtos.push({nome,categoria,descricao,preco,fotos});
salvar();
mostrar();

document.getElementById("name").value="";
document.getElementById("description").value="";
document.getElementById("price").value="";
document.getElementById("photos").value="";

alert("Conta adicionada!");
}catch(e){
alert("Não foi possível salvar. Tente imagens menores.");
}
}

function redimensionar(file){
return new Promise((resolve,reject)=>{
const img=new Image();
const reader=new FileReader();

reader.onload=e=>{
img.onload=()=>{
const canvas=document.createElement("canvas");
const max=600;
const escala=Math.min(1,max/img.width,max/img.height);

canvas.width=img.width*escala;
canvas.height=img.height*escala;

canvas.getContext("2d").drawImage(
img,0,0,canvas.width,canvas.height
);

resolve(canvas.toDataURL("image/jpeg",0.7));
};
img.onerror=reject;
img.src=e.target.result;
};

reader.onerror=reject;
reader.readAsDataURL(file);
});
}

mostrar();
</script></body>
</html>
